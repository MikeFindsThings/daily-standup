[project]
name = "daily-standup"
version = "0.1.0"
description = "Tech news humor drafts: Prefect Cloud flow + FastMCP server + Claude client"
requires-python = ">=3.12"
dependencies = [
    "prefect>=3.9,<4",
    "fastmcp>=4.2,<5",
    "anthropic>=1,<2",
    "feedparser>=6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

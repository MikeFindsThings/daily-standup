name: daily-standup
prefect-version: 3.9.3

# Prefect Managed compute has no access to this machine, so every run clones the repo.
# The repo is public, so the clone needs no credentials.
pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/MikeFindsThings/daily-standup.git
      branch: main

deployments:
  # The real thing: drafts a post every morning and waits for approval.
  - name: daily
    entrypoint: flows/daily_standup.py:daily_standup
    description: Draft today's tech-news one-liner and wait for a human to approve it.
    schedules:
      - cron: "30 9 * * *"
        timezone: America/Los_Angeles
    work_pool:
      name: managed-pool
      job_variables:
        pip_packages:
          - "anthropic>=1,<2"
          - "feedparser>=6"
          - "posthog>=8,<9"
        env:
          # suspend_flow_run requires result persistence to be on.
          PREFECT_RESULTS_PERSIST_BY_DEFAULT: "true"

  # Stage 0 connectivity check, still used by the MCP server's test tool.
  - name: stage0
    entrypoint: flows/hello.py:hello
    parameters:
      name: world
    work_pool:
      name: managed-pool
